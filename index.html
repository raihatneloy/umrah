<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#072A20">
<title>Umrah 2026</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
@font-face{font-family:'Amiri';src:url('./fonts/amiri.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Poppins';src:url('./fonts/poppins-r.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Poppins';src:url('./fonts/poppins-sb.woff2') format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Poppins';src:url('./fonts/poppins-b.woff2') format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Bengali';src:url('./fonts/bengali.woff2') format('woff2');font-weight:400 700;font-display:swap;size-adjust:96%}
:root{
  --ink:#041C16; --deep:#072A20; --panel:#0A3327;
  --gold:#C9A24B; --gold-lt:#E7CB8C; --gold-dim:rgba(201,162,75,.34);
  --ivory:#F6F0E3; --paper-ink:#12312A; --sage:#8FA99F; --line:rgba(201,162,75,.22);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--ink); color:var(--ivory);
  font:15px/1.5 'Poppins',-apple-system,system-ui,sans-serif;
  overscroll-behavior-y:contain;
}
#root{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  background:radial-gradient(120% 60% at 50% -10%, rgba(201,162,75,.13), transparent 60%),
             linear-gradient(180deg,#072A20 0%, #041C16 55%, #03150F 100%);
  position:relative}
#root.light{
  background:radial-gradient(110% 50% at 50% -8%, rgba(201,162,75,.18), transparent 62%),
             linear-gradient(180deg,#F8F3E7 0%, #F1E9D8 60%, #EADFC9 100%);
  color:var(--paper-ink);
}
/* The arabesque from the design board, brought into the app: an 88px tile of two
   squares — one rotated 45 degrees — joined by connector lines, which reads as an
   eight-point star lattice. Gold at 0.16 stroke, halved again here, so it is texture
   rather than decoration and never competes with the text. */
#root::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='88' height='88' viewBox='0 0 88 88'><g fill='none' stroke='%23C9A24B' stroke-width='0.9' opacity='0.16'><rect x='24' y='24' width='40' height='40'/><rect x='24' y='24' width='40' height='40' transform='rotate(45 44 44)'/><path d='M44 4 L44 24 M44 64 L44 84 M4 44 L24 44 M64 44 L84 44'/></g></svg>");
  background-size:88px 88px;background-position:center top}
#root.light::before{opacity:.2}
header{position:sticky;top:0;z-index:20;padding:calc(8px + env(safe-area-inset-top)) 0 8px;
  background:linear-gradient(180deg, rgba(4,28,22,.97), rgba(4,28,22,.82));backdrop-filter:blur(10px)}
#root.light header{background:linear-gradient(180deg, rgba(248,243,231,.97), rgba(240,232,216,.85))}
#root.bn{font-family:'Bengali','Poppins',system-ui,sans-serif}
#root.bn .t,#root.bn .big,#root.bn .n2,#root.bn .ti{line-height:1.45}
#root.bn .eyebrow,#root.bn .section .s,#root.bn nav a,#root.bn .date,#root.bn .sub{letter-spacing:0;font-size:11px}
#root.bn .pray .n,#root.bn .chips button,#root.bn .pill{letter-spacing:0}
#root.bn .pray .n{font-size:9px;opacity:.78}
#root.bn .count .n{font-size:17px}
#root.bn .ar{font-family:'Amiri','Scheherazade New',serif}
#root.bn .pad button.wide{font-size:11px}
#root.bn .duacard .whenline{letter-spacing:0}
.brand{display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.brand .l{display:flex;align-items:center;gap:9px}
.brand .k{font-size:9.5px;letter-spacing:.22em;font-weight:600;color:var(--gold)}
#root.light .brand .k{color:#8A6A21}
.lang{font-size:10px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);color:var(--sage);
  background:transparent;font-family:inherit}
#root.light .lang{color:#6F6650;border-color:rgba(18,49,42,.18)}
main{flex:1;padding-bottom:82px}
.view{padding:6px 0 calc(88px + env(safe-area-inset-bottom))}
.view.fade{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
h1.t{font-size:25px;font-weight:600;letter-spacing:-.01em;padding:4px 18px 0}
.date{font-size:11.5px;opacity:.65;padding:4px 18px 0}
.sub{font-size:12px;opacity:.62;padding:2px 18px 0}
.section{display:flex;align-items:center;gap:10px;padding:18px 18px 8px}
.section .s{font-size:9px;letter-spacing:.24em;opacity:.55;font-weight:600;white-space:nowrap}
.section .hr{height:1px;flex:1;background:linear-gradient(90deg,var(--line),transparent)}

/* tab bar */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;max-width:520px;margin:0 auto;
  border-top:1px solid var(--line);background:rgba(3,20,15,.92);backdrop-filter:blur(12px);
  padding:7px 4px calc(7px + env(safe-area-inset-bottom))}
#root.light nav{background:rgba(255,252,245,.94);border-color:rgba(18,49,42,.14)}
nav a{flex:1;text-align:center;text-decoration:none;color:inherit;font-size:8px;letter-spacing:.04em;
  opacity:.5;padding:2px 0;display:block}
nav a.on{opacity:1;color:var(--gold-lt)}
#root.light nav a{color:#5C5A4C}
#root.light nav a.on{color:#8A6A21}
nav svg{display:block;width:20px;height:20px;margin:0 auto 3px}
nav a span{display:block}

/* cards */
.card{margin:10px 14px 0;border-radius:18px;padding:15px 15px 14px;position:relative;overflow:hidden;
  background:linear-gradient(155deg, rgba(201,162,75,.14), rgba(201,162,75,.03) 42%, rgba(255,255,255,.02));
  border:1px solid rgba(201,162,75,.26)}
#root.light .card{background:rgba(255,255,255,.7);border-color:rgba(18,49,42,.10)}
.card .eyebrow{font-size:8.5px;letter-spacing:.24em;color:var(--gold-lt);font-weight:600}
#root.light .card .eyebrow{color:#8A6A21}
.card .big{font-size:20px;font-weight:600;margin-top:6px;line-height:1.25}
.card .prose{font-size:13px;line-height:1.66;opacity:.88;margin:0;letter-spacing:.002em}
.card .prose + .prose{margin-top:9px}
.card .meta{font-size:11px;opacity:.7;margin-top:5px}
.row{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.pill{font-size:9px;letter-spacing:.1em;padding:5px 10px;border-radius:20px;border:1px solid rgba(201,162,75,.3);
  color:var(--gold-lt);background:rgba(201,162,75,.08)}
#root.light .pill{color:#8A6A21;background:rgba(201,162,75,.13);border-color:rgba(176,138,52,.35)}
.pill.solid{background:var(--gold);color:#20180A;border-color:var(--gold);font-weight:600}
/* the MAP button is a thumb target on a moving bus, not a label: 44px tall, padded */
.doc a[data-map]{display:inline-flex;align-items:center;justify-content:center;
  min-width:58px;min-height:44px;margin:-6px -4px -6px 10px;border-radius:14px;
  -webkit-tap-highlight-color:transparent}
.doc a[data-map] .pill{padding:9px 13px;font-size:10px;letter-spacing:.12em}
.doc a[data-map]:active{opacity:.6}
.count{margin-left:auto;text-align:right}
.count .n{font-size:20px;color:var(--gold-lt);line-height:1;font-variant-numeric:tabular-nums;font-weight:600}
#root.light .count .n{color:#8A6A21}
.count .l{font-size:7.5px;letter-spacing:.16em;opacity:.6;margin-top:3px}

/* prayer strip */
.pray{display:flex;margin:12px 14px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden;
  background:rgba(255,255,255,.02)}
.pray div{flex:1;text-align:center;padding:8px 1px 7px;border-right:1px solid rgba(201,162,75,.13)}
.pray div:last-child{border-right:0}
.pray .n{font-size:7px;letter-spacing:.08em;opacity:.55}
.pray .v{font-size:11px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.pray .now{background:rgba(201,162,75,.16)}
.pray .now .v{color:var(--gold-lt)}
#root.light .pray .now .v{color:#8A6A21}
.pray .past{opacity:.4}

/* list rows */
.list{padding:2px 14px 0}
.item{display:flex;gap:11px;padding:11px 2px;border-bottom:1px solid rgba(201,162,75,.10);
  align-items:flex-start;cursor:pointer}
#root.light .item{border-color:rgba(18,49,42,.09)}
.item:last-child{border-bottom:0}
.chk{width:19px;height:19px;border-radius:50%;border:1px solid var(--gold-dim);flex:0 0 auto;margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:#20180A;transition:.15s}
.chk.on{background:var(--gold);border-color:var(--gold)}
.item .tx{flex:1;min-width:0}
.item .ti{font-size:13.5px;font-weight:600;line-height:1.3}
.item .ds{font-size:11px;opacity:.6;margin-top:2px;line-height:1.4}
.item.done .ti{opacity:.45;text-decoration:line-through;text-decoration-color:rgba(201,162,75,.5)}
.item .chev{opacity:.3;font-size:16px;align-self:center}
.item .chk{position:relative}
.item .chk::after{content:"";position:absolute;inset:-11px -12px -11px -10px;border-radius:50%}
.tm{width:44px;flex:0 0 auto;font-size:11px;opacity:.6;font-variant-numeric:tabular-nums;padding-top:2px}

/* ritual / dua detail */
.stepbar{display:flex;gap:3px;padding:10px 18px 0}
.stepbar i{height:3px;flex:1;border-radius:2px;background:rgba(255,255,255,.13)}
#root.light .stepbar i{background:rgba(18,49,42,.12)}
.stepbar i.on{background:var(--gold)}
.stepbar i.cur{background:var(--gold-lt);box-shadow:0 0 8px rgba(231,203,140,.6)}
.rite{margin:14px 18px 0}
.rite .n{font-size:9px;letter-spacing:.22em;color:var(--gold);font-weight:600}
.rite .t{font-size:27px;font-weight:600;margin-top:5px;line-height:1.2}
.rite .s{font-size:12px;opacity:.65;margin-top:5px;line-height:1.5}
.circuits{display:flex;gap:8px;margin:16px 18px 0;flex-wrap:wrap}
.circuits button{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold-dim);background:transparent;
  color:rgba(255,255,255,.4);font:600 13px inherit;font-family:inherit}
#root.light .circuits button{color:rgba(18,49,42,.45)}
.circuits button.on{background:linear-gradient(160deg,var(--gold-lt),var(--gold));border-color:var(--gold-lt);color:#20180A}
.circuits button.cur{border-color:var(--gold-lt);color:var(--gold-lt);box-shadow:0 0 0 3px rgba(201,162,75,.13)}

.duacard{margin:14px 14px 0;border-radius:18px;padding:16px 14px 13px;position:relative;overflow:hidden;
  background:linear-gradient(170deg, rgba(255,255,255,.055), rgba(255,255,255,.015));
  border:1px solid rgba(201,162,75,.26)}
#root.light .duacard{background:rgba(255,255,255,.72);border-color:rgba(18,49,42,.1)}
.duacard .rule{position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.ar{font-family:'Amiri','Scheherazade New',serif;font-size:26px;line-height:2;text-align:center;text-wrap:balance;
  direction:rtl;unicode-bidi:isolate;color:#FBF5E7}
#root.light .ar{color:#1B3A32}
.ar.multi{white-space:pre-line;text-align:right;font-size:23px;line-height:2.05;padding:2px 2px 0}
.tr{font-size:11.5px;line-height:1.6;opacity:.68;text-align:center;margin-top:10px;font-style:italic}
.mn{font-size:12px;line-height:1.6;text-align:center;margin-top:8px;opacity:.85}
.src{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:12px;padding-top:10px;
  border-top:1px solid rgba(201,162,75,.16);flex-wrap:wrap;text-align:center}
.badge{font-size:8px;letter-spacing:.08em;padding:3px 8px;border-radius:12px;
  background:rgba(122,196,160,.13);color:#9BD8BE;border:1px solid rgba(122,196,160,.28)}
.badge.amber{background:rgba(201,162,75,.14);color:#E7CB8C;border-color:rgba(201,162,75,.4)}
#root.light .badge.amber{background:rgba(154,116,30,.12);color:#7A5713;border-color:rgba(154,116,30,.42);font-weight:600}
/* QUR'AN badge — gold, the strongest provenance there is */
.badge.q{background:rgba(201,162,75,.2);color:#F0D79B;border-color:rgba(201,162,75,.6);font-weight:600}
#root.light .badge.q{background:rgba(154,116,30,.16);color:#5F4409;border-color:rgba(154,116,30,.55)}
.srct{font-size:10px;opacity:.55;line-height:1.4}

.acts{display:flex;gap:10px;padding:14px 14px 0}
.btn{flex:1;text-align:center;padding:13px;border-radius:14px;font:600 12px inherit;font-family:inherit;
  letter-spacing:.08em;border:0;cursor:pointer}
.btn.gold{background:linear-gradient(160deg,var(--gold-lt),var(--gold));color:#20180A}
.btn.ghost{background:transparent;border:1px solid var(--gold-dim);color:var(--sage)}
#root.light .btn.ghost{color:#6F6650}
.btn:disabled{opacity:.4}

.rulecard{margin:10px 14px 0;padding:12px 13px;border-radius:14px;border:1px solid rgba(201,162,75,.16);
  background:rgba(255,255,255,.035)}
#root.light .rulecard{background:rgba(255,255,255,.55);border-color:rgba(18,49,42,.09)}
.rulecard .h{display:flex;gap:7px;align-items:baseline}
.rulecard .rf{font-size:9px;color:var(--gold);letter-spacing:.08em;flex:0 0 auto}
.rulecard .tp{font-size:12.5px;font-weight:600}
.rulecard .tx{font-size:11.5px;opacity:.72;margin-top:6px;line-height:1.5}
.rulecard .mk{font-size:11.5px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(201,162,75,.12)}
.rulecard .mk b{color:#E7A9A0;font-weight:600}
.rulecard .rm b{color:#9BD8BE;font-weight:600}
.rulecard .fam{font-size:11px;opacity:.6;margin-top:6px;font-style:italic}
.rulecard .sc{font-size:9.5px;opacity:.42;margin-top:6px;word-break:break-word}

/* chips + search */
.search{margin:12px 14px 0;display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:13px;
  background:rgba(255,255,255,.05);border:1px solid var(--line)}
#root.light .search{background:rgba(255,255,255,.6);border-color:rgba(18,49,42,.13)}
.search input{flex:1;background:transparent;border:0;outline:0;color:inherit;font:inherit;font-size:13px}
.chips{display:flex;gap:7px;padding:10px 14px 0;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button i{font-style:normal;opacity:.45;font-size:9px;margin-left:5px;letter-spacing:0}
.chips button{font-size:10.5px;padding:6px 11px;border-radius:20px;border:1px solid rgba(201,162,75,.25);
  background:transparent;color:inherit;opacity:.75;white-space:nowrap;font-family:inherit}
#root.light .chips button{border-color:rgba(18,49,42,.16)}
.chips button.on{background:var(--gold);color:#20180A;border-color:var(--gold);opacity:1;font-weight:600}

/* vault */
.pin{padding:22px 24px 0;text-align:center}
.pin .dots{display:flex;justify-content:center;gap:12px;margin:18px 0 4px}
.pin .dots i{width:11px;height:11px;border-radius:50%;border:1px solid rgba(201,162,75,.5);display:block}
.pin .dots i.on{background:var(--gold-lt);border-color:var(--gold-lt)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px 34px 0}
.pad button{aspect-ratio:1;border-radius:50%;border:1px solid rgba(201,162,75,.22);background:rgba(255,255,255,.03);
  color:var(--ivory);font:600 19px inherit;font-family:inherit}
#root.light .pad button{color:var(--paper-ink);background:rgba(255,255,255,.5)}
.pad button.wide{font-size:8px;letter-spacing:.08em;line-height:1.3}
.pad button:active{background:rgba(201,162,75,.25)}
.doc{display:flex;align-items:center;gap:11px;background:rgba(255,255,255,.05);border:1px solid rgba(201,162,75,.18);
  border-radius:14px;padding:11px 12px;margin:9px 14px 0}
#root.light .doc{background:rgba(255,255,255,.62);border-color:rgba(18,49,42,.1)}
.doc .ic{width:32px;height:38px;border-radius:6px;border:1px solid rgba(201,162,75,.45);display:flex;
  align-items:center;justify-content:center;font-size:6.5px;letter-spacing:.05em;color:var(--gold-lt);
  flex:0 0 auto;background:rgba(201,162,75,.07)}
.doc .tx{flex:1;min-width:0}
.doc .n2{font-size:12.5px;font-weight:600;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.doc .m2{font-size:10px;opacity:.55;margin-top:3px;unicode-bidi:plaintext;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* on the places screen the description is the whole point of the row — never clamp it,
   and balance the titles so a name does not hang on one orphaned word */
.doc[data-place] .m2{-webkit-line-clamp:unset;display:block;overflow:visible;font-size:11px;opacity:.62;line-height:1.55}
.doc[data-place] .n2{text-wrap:balance;margin-bottom:3px}
.doc .ic{font-size:11px}
.doc .x{background:transparent;border:0;color:#C08A80;font-size:16px;padding:6px;font-family:inherit}

/* present mode */
.present{position:fixed;inset:0;z-index:100;background:#02100C;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:24px}
.present img{max-width:100%;max-height:72vh;background:#fff;border-radius:10px}
.present iframe{width:100%;height:70vh;border:0;background:#fff;border-radius:10px}
.present .hdr{text-align:center;margin-bottom:16px}
.present .hdr .k{font-size:9px;letter-spacing:.24em;color:var(--gold);font-weight:600}
.present .hdr .n{font-size:16px;font-weight:600;margin-top:6px}
.present .close{position:absolute;top:calc(14px + env(safe-area-inset-top));right:16px;background:transparent;
  border:1px solid var(--gold-dim);color:var(--gold-lt);border-radius:20px;padding:6px 13px;font:inherit;font-size:11px}

.duacard .whenline{font-size:11px;line-height:1.5;opacity:.62;margin-top:10px;padding-top:9px;border-top:1px solid rgba(201,162,75,.18)}
.duacard .whenline b{color:var(--gold-lt);font-weight:600;letter-spacing:.1em;font-size:9.5px;display:block;margin-bottom:3px;opacity:.9}
#root.light .duacard .whenline{border-color:rgba(176,138,52,.22)}
.present .pdfpages{width:100%;max-width:560px;max-height:72vh;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;align-items:center;gap:10px;border-radius:10px}
.present .pdfpages canvas{background:#fff;border-radius:8px;box-shadow:0 6px 22px rgba(0,0,0,.45)}
.present .pdfpages img{max-width:100%;max-height:72vh;background:#fff;border-radius:10px}
.present .pvnote{font-size:10px;opacity:.6;margin-top:14px;letter-spacing:.16em}
.present .btn.gold{max-width:280px;padding:14px 18px}
.muted{font-size:11px;opacity:.55;line-height:1.5;padding:10px 18px 0}
.empty{text-align:center;padding:34px 24px;opacity:.55;font-size:12.5px;line-height:1.6}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;z-index:200;background:rgba(20,44,36,.97);
  border:1px solid var(--gold-dim);color:var(--ivory);padding:10px 16px;border-radius:12px;font-size:12px;
  max-width:88%;text-align:center;transition:.2s}
.offlinebanner{display:flex;align-items:center;gap:8px;margin:10px 14px 0;padding:9px 12px;border-radius:12px;
  background:rgba(62,143,108,.12);border:1px solid rgba(62,143,108,.28);font-size:11px;color:#8FD3B6}
#root.light .offlinebanner{color:#2F7057}
</style>
</head>
<body>
<div id="root">
  <header>
    <div class="brand">
      <div class="l">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#C9A24B" stroke-width="1.2" aria-hidden="true">
          <rect x="5.2" y="5.2" width="13.6" height="13.6"/><rect x="5.2" y="5.2" width="13.6" height="13.6" transform="rotate(45 12 12)"/>
        </svg>
        <span class="k" id="brand">UMRAH 2026</span>
      </div>
      <button class="lang" id="langbtn">EN</button>
    </div>
  </header>
  <main id="view"></main>
